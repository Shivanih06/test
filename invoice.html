<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Invoice</title>
<style>
  :root{
    --navy:#0f2d6b; --orange:#e8520a; --ink:#141a2e; --muted:#697086;
    --line:#d5d9e2; --paper:#ffffff; --bg:#eef1f6; --green:#0f9d58;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 60px}
  .sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  /* Header */
  .head{padding:24px 26px;border-bottom:2px solid var(--navy)}
  .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .co{font-size:21px;font-weight:800;color:var(--navy);line-height:1.15}
  .co-contact{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .idbox{border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;min-width:180px}
  .idbox-label{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--muted)}
  .idbox-no{font-size:20px;font-weight:800;color:var(--navy);margin:2px 0 8px;font-variant-numeric:tabular-nums}
  .idbox-row{font-size:11px;color:var(--muted);padding:2px 0}
  .idbox-row b{color:var(--ink)}
  .stamp{display:inline-block;margin-top:8px;padding:4px 13px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:1.5px}
  .stamp.paid{background:rgba(15,157,88,.14);color:var(--green)}
  .stamp.due{background:rgba(232,82,10,.14);color:var(--orange)}
  /* Amount banner */
  .amount-band{background:#f7f8fa;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .amount-lbl{font-size:11px;letter-spacing:1px;font-weight:700;color:var(--muted)}
  .amount{font-size:30px;font-weight:800;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--ink)}
  /* Body */
  .body{padding:22px 26px 10px}
  .boxed{border:1px solid var(--line);border-radius:8px;margin-bottom:18px;overflow:hidden}
  .boxed-label{background:#f7f8fa;border-bottom:1px solid var(--line);padding:8px 14px;font-size:11px;letter-spacing:1px;font-weight:800;color:var(--muted);text-align:center}
  .boxed-body{padding:14px 16px}
  .pname{font-weight:700;font-size:15px}
  .pline{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.6}
  /* Table */
  table{width:100%;border-collapse:collapse}
  thead th{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--muted);text-align:left;padding:9px 14px;background:#f7f8fa;border-bottom:1px solid var(--line)}
  thead th.r{text-align:right}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  tbody tr:last-child td{border-bottom:none}
  tbody td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.qty{color:var(--muted);width:44px}
  /* Totals + payments */
  .totals{margin-left:auto;width:min(300px,100%)}
  .trow{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
  .trow .lbl{color:var(--muted)}
  .trow.disc .lbl,.trow.disc .val{color:var(--green)}
  .trow.grand{border-top:2px solid var(--navy);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800}
  .trow .val{font-variant-numeric:tabular-nums}
  .pay-row{display:flex;justify-content:space-between;padding:2px 0;font-size:13.5px;color:var(--green);font-weight:700}
  /* Actions + footer */
  .actions{padding:6px 26px 4px;display:flex;flex-direction:column;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:8px;padding:15px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
  .btn-pay{background:var(--orange);color:#fff}
  .btn-print{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .pay-panel{padding:18px 26px 6px}
  .pay-card-el{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px}
  .pay-error{color:#d03030;font-size:12.5px;min-height:16px;margin-bottom:10px}
  .pay-secure{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
  .foot{padding:20px 26px 26px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7;border-top:1px solid var(--line);margin-top:6px}
  .foot .thanks{color:var(--ink);font-weight:700;font-size:14px;margin-bottom:4px}
  /* Referral + trust footer blocks */
  .refer{padding:24px 26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .refer-text{flex:1;min-width:200px}
  .refer-text .rt1{color:var(--navy);font-weight:700;font-size:14px}
  .refer-text a{color:var(--orange);font-weight:800;text-decoration:none}
  .refer-photo{width:96px;height:96px;border-radius:10px;object-fit:cover;flex-shrink:0}
  .refer-icon{width:96px;height:96px;border-radius:10px;background:#f7f8fa;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
  .trust{padding:16px 26px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .trust-icon{width:34px;height:34px;border-radius:50%;background:#eafaf0;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .empty{padding:60px 24px;text-align:center;color:var(--muted)}
  @media print{
    html,body{background:#fff}
    .wrap{padding:0;max-width:none}
    .sheet{border:none;border-radius:0}
    .actions{display:none}
    .amount-band,thead th,.boxed-label{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<script src="https://js.stripe.com/v3/"></script>
<body>
  <div class="wrap"><div id="root" class="sheet"><div class="empty">Loading invoice…</div></div></div>
<script>
  var M = function(n){ n = Number(n)||0; return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var D = function(s){ try{ return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}); }catch(e){ return s||''; } };
  var esc = function(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };

  var SUPABASE_URL = 'https://znjclglbjifracvrzkik.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_aUuw2yi8tcZCEWA5CFkg8Q_UZBnDh82';

  function showError(msg){ document.getElementById('root').innerHTML = '<div class="empty">'+msg+'</div>'; }

  async function render(){
    var root = document.getElementById('root');
    var hash = location.hash.slice(1);
    var idParam = new URLSearchParams(location.search).get('id');

    // Legacy links (the whole invoice encoded directly in the URL) — kept working for
    // anything already sent before this fix, but no longer how new links are built:
    // those links got long enough to be mangled or truncated by SMS/carrier
    // infrastructure, which is exactly what broke a real texted invoice link.
    if (hash) {
      try{
        var b = hash.replace(/-/g,'+').replace(/_/g,'/');
        while(b.length % 4) b += '=';
        renderInvoice(JSON.parse(decodeURIComponent(escape(atob(b)))));
      } catch(e){ showError('This invoice link looks incomplete or damaged.'); }
      return;
    }

    if (idParam) {
      root.innerHTML = '<div class="empty">Loading invoice…</div>';
      try {
        var resp = await fetch(SUPABASE_URL+'/functions/v1/get-invoice-public?id='+encodeURIComponent(idParam), {
          headers: { 'apikey': SUPABASE_KEY }
        });
        var data = await resp.json();
        if (!resp.ok || data.error) { showError(data.error || 'This invoice could not be found.'); return; }
        renderInvoice(data);
      } catch(e) { showError('Could not load this invoice — check your connection and try again.'); }
      return;
    }

    showError('No invoice data in this link.');
  }

  function renderInvoice(d){
    var root = document.getElementById('root');
    var items = d.items || [];
    var discounts = items.filter(function(it){ return (it.p||0) < 0; });
    var taxItems = items.filter(function(it){ return it.d === 'Sales Tax' && (it.p||0) >= 0; });
    var charges = items.filter(function(it){ return (it.p||0) >= 0 && it.d !== 'Sales Tax'; });
    var subtotal = charges.reduce(function(s,it){ return s+(it.p||0); },0);
    var taxAmt = taxItems.reduce(function(s,it){ return s+(it.p||0); },0);
    var total = (typeof d.total === 'number') ? d.total : items.reduce(function(s,it){ return s+(it.p||0); },0);
    var paid = d.status === 'paid';
    document.title = 'Invoice #' + (d.num||'') + (d.co?(' — '+d.co):'');

    var contact = [d.ph, d.em, d.web].filter(Boolean).map(esc).join('&nbsp;&nbsp;·&nbsp;&nbsp;');

    var rows = charges.length ? charges.map(function(it){
      return '<tr><td>'+esc(it.d||'Item')+'</td><td class="qty r">'+(it.q&&it.q>1?('×'+it.q):'')+'</td><td class="r">'+M(it.p)+'</td></tr>';
    }).join('') : '<tr><td colspan="3" style="color:var(--muted);padding:16px 0">No line items.</td></tr>';

    var discRows = discounts.map(function(it){
      return '<div class="trow disc"><span class="lbl">'+esc(it.d||'Discount')+'</span><span class="val">−'+M(Math.abs(it.p))+'</span></div>';
    }).join('');
    var taxRow = taxAmt > 0 ? '<div class="trow"><span class="lbl">Sales Tax</span><span class="val">'+M(taxAmt)+'</span></div>' : '';
    var paymentRow = (paid && d.paidVia) ? '<div class="pay-row"><span>'+esc(d.paidVia)+'</span><span>−'+M(total)+'</span></div>' : '';

    window._invoiceData = d; // needed by the payment flow below
    var payBtn = (!paid && d.stripeKey) ? '<button class="btn btn-pay" onclick="showPayPanel()">Pay '+M(total)+' now</button>' : '';

    var referBlock = d.reviewLink ?
      ('<div class="refer">'
        + '<div class="refer-text"><div class="rt1">Know someone who needs junk cleared out?</div>'
        +   'Send them our way — <a href="'+esc(d.reviewLink)+'">leave us a review</a> and let others know!</div>'
        + (d.photo ? '<img class="refer-photo" src="'+esc(d.photo)+'" alt="">' : '<div class="refer-icon">🚛</div>')
        + '</div>')
      : (d.photo ? ('<div class="refer"><img class="refer-photo" src="'+esc(d.photo)+'" alt=""><div class="refer-text"><div class="rt1">Thanks for choosing '+esc(d.co||'us')+'!</div></div></div>') : '');
    var trustBlock = '<div class="trust"><div class="trust-icon">♻</div><div>'+esc(d.co||'We')+' is committed to responsible, eco-conscious disposal — donating and recycling what we can, every job.</div></div>';

    root.innerHTML =
      '<div class="head">'
      +   '<div class="head-row">'
      +     '<div><div class="co">'+esc(d.co||'Invoice')+'</div>'
      +       (contact?('<div class="co-contact">'+contact+'</div>'):'')+'</div>'
      +     '<div class="idbox">'
      +       '<div class="idbox-label">INVOICE</div><div class="idbox-no">#'+esc(d.num||'')+'</div>'
      +       '<div class="idbox-row">Issued: <b>'+D(d.date)+'</b></div>'
      +       (d.jobDate&&d.jobDate!==d.date?('<div class="idbox-row">Service date: <b>'+D(d.jobDate)+'</b></div>'):'')
      +       '<div class="stamp '+(paid?'paid':'due')+'">'+(paid?'PAID':'DUE')+'</div>'
      +     '</div>'
      +   '</div>'
      + '</div>'
      + '<div class="amount-band"><div><div class="amount-lbl">'+(paid?'TOTAL PAID':'AMOUNT DUE')+'</div>'
      +   '<div class="amount">'+M(total)+'</div></div></div>'
      + '<div class="body">'
      +   '<div class="boxed">'
      +     '<div class="boxed-label">BILLED TO</div>'
      +     '<div class="boxed-body"><div class="pname">'+esc(d.cust||'—')+'</div>'
      +       (d.cph?'<div class="pline">'+esc(d.cph)+'</div>':'')
      +       (d.caddr?'<div class="pline">'+esc(d.caddr)+'</div>':'')+'</div>'
      +   '</div>'
      +   '<div class="boxed">'
      +     '<div class="boxed-label">INVOICE DETAILS</div>'
      +     '<table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead>'
      +       '<tbody>'+rows+'</tbody></table>'
      +   '</div>'
      +   '<div class="totals">'
      +     '<div class="trow"><span class="lbl">Subtotal</span><span class="val">'+M(subtotal)+'</span></div>'
      +     discRows
      +     taxRow
      +     '<div class="trow grand"><span>Total</span><span class="val">'+M(total)+'</span></div>'
      +   '</div>'
      +   (paymentRow ? ('<div class="boxed" style="margin-top:18px"><div class="boxed-label">PAYMENTS</div><div class="boxed-body">'+paymentRow+'</div></div>') : '')
      + '</div>'
      + '<div class="actions">'+payBtn+'<button class="btn btn-print" onclick="window.print()">Print or save as PDF</button></div>'
      + '<div class="pay-panel" id="pay-panel" style="display:none">'
      +   '<div class="pay-card-el" id="stripe-card-element"></div>'
      +   '<div class="pay-error" id="pay-error"></div>'
      +   '<button class="btn btn-pay" id="pay-confirm-btn" style="width:100%" onclick="confirmInvoicePayment()">Charge '+M(total)+'</button>'
      +   '<div class="pay-secure">🔒 Processed securely by Stripe — your card details never touch our servers.</div>'
      + '</div>'
      + referBlock
      + trustBlock
      + '<div class="foot"><div class="thanks">Thank you for your business.</div>'
      +   'Questions about this invoice? '+(d.ph?('Call '+esc(d.ph)):'Contact us')+(d.em?(' or email '+esc(d.em)):'')+'.</div>';
  }

  // ── Payment (embedded Stripe card entry — no Thrive login needed) ──
  var _stripe = null, _card = null;
  function showPayPanel(){
    var d = window._invoiceData;
    if (!d || !d.stripeKey) return;
    document.getElementById('pay-panel').style.display = 'block';
    if (!_stripe) _stripe = Stripe(d.stripeKey);
    if (_card) { try { _card.unmount(); } catch(e){} }
    var elements = _stripe.elements();
    _card = elements.create('card', { style: { base: { fontSize: '15px' } } });
    _card.mount('#stripe-card-element');
    _card.on('change', function(ev){ document.getElementById('pay-error').textContent = ev.error ? ev.error.message : ''; });
  }
  async function confirmInvoicePayment(){
    var d = window._invoiceData;
    var btn = document.getElementById('pay-confirm-btn');
    var errEl = document.getElementById('pay-error');
    btn.disabled = true; var origText = btn.textContent; btn.textContent = 'Processing…';
    try {
      var piResp = await fetch(SUPABASE_URL+'/functions/v1/create-invoice-payment-intent', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ invoiceId: d.id }),
      });
      var piData = await piResp.json();
      if (!piResp.ok || !piData.clientSecret) { errEl.textContent = piData.error || 'Could not start payment.'; btn.disabled=false; btn.textContent=origText; return; }

      var result = await _stripe.confirmCardPayment(piData.clientSecret, { payment_method: { card: _card } });
      if (result.error) { errEl.textContent = result.error.message; btn.disabled=false; btn.textContent=origText; return; }

      var confirmResp = await fetch(SUPABASE_URL+'/functions/v1/confirm-invoice-payment', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ invoiceId: d.id, paymentIntentId: result.paymentIntent.id }),
      });
      var confirmData = await confirmResp.json();
      if (!confirmResp.ok || !confirmData.ok) { errEl.textContent = confirmData.error || 'Payment succeeded but could not be confirmed — contact us to be sure.'; btn.disabled=false; btn.textContent=origText; return; }

      render(); // re-fetch and redraw — now shows PAID
    } catch(e) {
      errEl.textContent = 'Something went wrong — check your connection and try again.';
      btn.disabled = false; btn.textContent = origText;
    }
  }

  render();
  window.addEventListener('hashchange', render);
</script>
</body>
</html>
